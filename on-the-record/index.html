<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ISCA SIG Atlas · Fancy edition</title>
<meta name="description" content="Twenty ISCA Special Interest Groups as a small town pressed onto a spinning record. An independent, AI-maintained directory.">
<meta name="theme-color" content="#efe5d8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23161412'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23444' stroke-width='.8'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23e0522d'/%3E%3Ccircle cx='16' cy='16' r='1' fill='%23161412'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..800&display=swap">
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"../shared/vendor/three/build/three.module.min.js","three/addons/":"../shared/vendor/three/examples/jsm/"}}</script>
<script type="module" src="main.js"></script>
</head>
<body>
<a class="skip" href="#sleeve-body">Skip to the SIG directory</a>
<div id="stage" aria-hidden="true"></div>

<header class="brand">
  <h1 class="brand-title">ISCA <span>SIG Atlas</span></h1>
  <nav class="edition-switch" aria-label="Website edition"><a href="./" aria-current="page">Fancy</a><a id="classic-edition" href="https://speechlab0210.github.io/isca-sig-directory/">Classic</a></nav>

</header>

<nav class="tools" aria-label="Turntable controls">
  <button class="tool" id="btn-reset" type="button" aria-label="Show the whole record" title="Return to the whole record (Esc)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/><circle cx="12" cy="12" r="5"/></svg><span class="tool-label">Whole record</span></button>
  <button class="tool" id="btn-play" aria-pressed="false" title="Drop the tonearm and play the tracklist (Space)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="14" r="6.5"/><circle cx="9" cy="14" r="1.6"/><path d="M20 3v8.5l-5.5 4"/></svg><span class="tool-label">Play</span></button>
  <button class="tool" id="btn-lamp" aria-pressed="false" title="Switch on the desk lamp (N)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span class="tool-label">Lamp</span></button>
  <button class="tool" id="btn-spin" aria-pressed="false" title="Pause or resume the slow spin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg><span class="tool-label">Pause</span></button>
</nav>


<button class="ticker" id="ticker" type="button" hidden></button>
<p class="hint" id="hint">Click a landmark to explore · Whole record or Esc to return · scroll to zoom</p>

<aside class="sleeve" id="sleeve" aria-label="Liner notes">
  <button class="sleeve-toggle" id="sleeve-toggle" type="button" aria-expanded="true" aria-controls="sleeve-body"><span>Liner notes</span></button>
  <nav class="edition-switch panel-editions" aria-label="Website edition"><a href="./" aria-current="page">Fancy</a><a href="https://speechlab0210.github.io/isca-sig-directory/">Classic</a></nav>
  <nav class="tabs" aria-label="Directory sections">
    <button type="button" data-view="tracklist" aria-label="SIG directory">SIGs</button>
    <button type="button" data-view="calendar">Upcoming</button>
    <button type="button" data-view="series">Series</button>
    <button type="button" data-view="library">Library</button>
    <button type="button" data-view="about">Maintenance</button>
  </nav>
  <p class="data-status" id="render-status" role="status" hidden></p>
  <p class="data-status" id="data-status" role="status" hidden></p>
  <section class="finder" aria-label="Search the whole Atlas">
    <label class="finder-search"><span class="sr-only">Search all Atlas pages</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></svg>
      <input id="search" type="search" placeholder="Search all pages: groups, events, recordings…" autocomplete="off">
    </label>
    <div class="chips" id="chips" role="group" aria-label="Filter groups"></div>
    <p class="finder-count" id="count" role="status"></p>
  </section>
    <div class="sleeve-bar"><button class="back" id="sleeve-back" type="button" hidden>← All SIGs</button></div>
  <div class="sleeve-body" id="sleeve-body" tabindex="-1"><p class="loading">Cueing the record…</p></div>
</aside>

<div class="tip" id="tip" role="tooltip" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<noscript><div class="noscript"><h1>ISCA SIG Atlas</h1><p>This view needs JavaScript. The same directory is available as the <a href="https://speechlab0210.github.io/isca-sig-directory/">classic text version</a>, and the official group list is on the <a href="https://isca-speech.org/Special-Interest-Groups">ISCA Special Interest Groups page</a>.</p></div></noscript>
</body>
</html>
